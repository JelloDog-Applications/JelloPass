<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 200px;
      margin: 0;
      padding: 12px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #e0e0e0;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .sub {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 10px;
    }
    #list {
      list-style: none;
      padding: 0;
      margin: 0 0 10px 0;
      max-height: 280px;
      overflow-y: auto;
    }
    #list li {
      padding: 8px 10px;
      margin: 2px 0;
      background: #2b2b2b;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #list li:hover { background: #3d3d3d; }
    #list li .name { font-weight: 500; }
    #list li .btns { display: flex; gap: 6px; }
    #list li button {
      padding: 4px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      background: #1a73e8;
      color: #fff;
    }
    #list li button.copy { background: #1a73e8; }
    #list li button.fill { background: #0d9488; }
    #list li button:hover { filter: brightness(1.1); }
    .status {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 8px;
      min-height: 18px;
    }
    .error { color: #f87171; }
    .ok { color: #4ade80; }
  </style>
</head>
<body>
  <h2>JelloPass</h2>
  <p class="sub">Keep the JelloPass app (GUI) open.</p>
  <ul id="list"></ul>
  <p class="status" id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
